# GOAT fork: workspace inheritance from libs/cua/Cargo.toml (trycua/cua c0d3b919fc46) written out,
# because this crate no longer sits in that workspace. Sources are unchanged; see vendor/README.md.
[package]
name = "cua-telemetry"
description = "Anonymous, content-free product telemetry shared by the cua SDK, the `cua` CLI, `cua daemon`, cua-spacesd, the Spaces app and cua-driver: one schema, one install id, one set of switches."
version = "0.24.2"
edition = "2024"
# Not the libs/cua workspace's 1.97: cua-driver links this crate, and the
# driver's Nix package builds with nixpkgs stable's rustc (1.95 in 26.05).
rust-version = "1.95"
authors = ["trycua"]
license = "MIT"
repository = "https://github.com/trycua/cua"

[features]
default = ["http"]
# The PostHog sender. Without it events are built, validated and logged
# locally (`show-last`) but never leave the machine.
http = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
toml_edit = "0.25"
ureq = { version = "3", optional = true, default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "3"
# GOAT fork: upstream also lists cua-connections here for one tests/privacy.rs check. That
# crate is not vendored and this crate's tests are not built in this repository, so it is left out.
